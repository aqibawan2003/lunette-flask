services:
  web:
    build: .
    image: lunette:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SUBSCRIBERS_FILE: /data/subscribers.jsonl
    volumes:
      - subscribers:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  subscribers:
